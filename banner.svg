<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0E15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16192B;stop-opacity:1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5" />
      <stop offset="50%" style="stop-color:#EC4899" />
      <stop offset="100%" style="stop-color:#F59E0B" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.8" />
    </linearGradient>

    <!-- Text Clip Path for Typing Effect -->
    <clipPath id="typingClip">
      <rect x="0" y="0" width="0" height="250">
        <animate attributeName="width" from="0" to="800" dur="3s" begin="0.5s" fill="freeze" keyTimes="0; 1" keySplines="0.4 0 0.2 1" calcMode="spline" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 400;
      font-size: 18px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'Segoe UI', BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #E2E8F0;
    }
    .cursor {
      fill: #EC4899;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 0.8s infinite;
    }
  </style>

  <!-- Background with slight rounded corners -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Glowing Border -->
  <rect x="1" y="1" width="798" height="248" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="15" />

  <!-- Mac-style Window Controls -->
  <circle cx="35" cy="30" r="6" fill="#EF4444" />
  <circle cx="55" cy="30" r="6" fill="#F59E0B" />
  <circle cx="75" cy="30" r="6" fill="#10B981" />

  <!-- Animated Content Group -->
  <g transform="translate(40, 20)">
    <!-- Animated Typing Text -->
    <g clip-path="url(#typingClip)">
      <text x="0" y="85" class="title">PromptIQ</text>
      <text x="0" y="130" class="subtitle">AI Credit Cost Analyzer &amp; Prompt Optimizer</text>
    </g>

    <!-- Blinking Cursor following the typing end -->
    <!-- Positioned approximately at the end of the text -->
    <rect x="440" y="113" width="3" height="20" class="cursor blinking-cursor" />

    <!-- Contributions Pill Badge -->
    <g transform="translate(0, 165)">
      <rect width="320" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="5" fill="#10B981" />
      <text x="32" y="19" class="badge-text">Contributors: Rohan &amp; Venkatesh</text>
    </g>
  </g>
</svg>
